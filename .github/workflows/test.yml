name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: >-
          python -m pip install pytest requests aiohttp yarl pandas pyyaml
          httpx python-dotenv pywin32
      - name: Compile Python sources
        run: python -m compileall -q alpha_mining 生成Alpha候选.py
      - name: Run test suite
        run: python -m pytest -q
