name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for security scanner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Security — verify git history
        run: python tools/security/verify_git_history.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: >-
          python -m compileall -q alpha_mining tools
          生成Alpha.py 提交Alpha.py 验证提交链路.py
          auto_alpha_pipeline_rebuilt_v50.py
      - name: Prepare test diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          python -VV 2>&1 | Out-File -FilePath test-results/diagnostics.txt -Encoding utf8
          python -m pip freeze 2>&1 | Out-File -FilePath test-results/diagnostics.txt -Encoding utf8 -Append
      - name: Run test suite
        shell: pwsh
        run: |
          python -m pytest -q --junitxml=test-results/junit.xml 2>&1 |
            Tee-Object -FilePath test-results/pytest-output.txt
          $pytestExit = $LASTEXITCODE
          $credentialPattern = '(?i)\b(password|passwd|token|cookie|authorization)\s*[:=]\s*[^\s,;<>]+'
          foreach ($path in @('test-results/pytest-output.txt', 'test-results/junit.xml')) {
            if (Test-Path $path) {
              $content = [IO.File]::ReadAllText($path)
              $content = [regex]::Replace($content, $credentialPattern, '$1=[REDACTED]')
              $content = [regex]::Replace($content, '(?i)\bBearer\s+[^\s,;<>]+', 'Bearer [REDACTED]')
              [IO.File]::WriteAllText($path, $content)
            }
          }
          if ($pytestExit -ne 0) { exit $pytestExit }
      - name: Publish failed test summary
        if: failure()
        shell: pwsh
        run: |
          $path = 'test-results/pytest-output.txt'
          if (Test-Path $path) {
            $summary = (Get-Content -LiteralPath $path -Tail 100) -join "`n"
            if ($summary.Length -gt 12000) {
              $summary = $summary.Substring($summary.Length - 12000)
            }
            $summary = $summary.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Pytest failure summary::$summary"
          }
      - name: Upload failed test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-${{ matrix.os }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
